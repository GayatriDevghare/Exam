<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Exam Question</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                to right,
                #87CEEB,
                #000080
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .exam-container {

            width: 700px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 0 20px rgba(0,0,0,0.4);

        }

        .header {

            display: flex;

            justify-content: space-between;

            margin-bottom: 20px;
        }

        .question-box {

            padding: 25px;

            border: 2px solid #000080;

            border-radius: 10px;

        }

        .question {

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 25px;

        }

        .option {

            display: block;

            padding: 12px;

            margin: 10px 0;

            background: #f1f1f1;

            border-radius: 8px;

            cursor: pointer;

        }

        .nav-buttons {

            margin-top: 25px;

            display: flex;

            justify-content: space-between;

        }

        .btn {

            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            background: #000080;

            color: white;

            cursor: pointer;

            font-weight: bold;

        }

        .end-btn {

            background: #dc3545;

        }

    </style>

</head>

<body>

<div class="exam-container">

    <div class="header">

        <div>
            👤 {{ request.session.username }}
        </div>

        <div>
            📚 {{ request.session.subject }}
        </div>

    </div>

    <hr>
<form method="POST" action="{% url 'next_question' %}">
    {% csrf_token %}

    <h3>{{ question.qtext }}</h3>

    <label>
        <input type="radio" name="answer" value="1">
        {{ question.op1 }}
    </label>

    <label>
        <input type="radio" name="answer" value="2">
        {{ question.op2 }}
    </label>

    <label>
        <input type="radio" name="answer" value="3">
        {{ question.op3 }}
    </label>

    <label>
        <input type="radio" name="answer" value="4">
        {{ question.op4 }}
    </label>

    <button type="submit">Next</button>
</form>
</div>

</body>

</html>
