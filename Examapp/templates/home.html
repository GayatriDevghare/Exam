
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Examination System</title>

    

    <style>

    /* ==============================
       RESET
    ============================== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }


    /* ==============================
       BODY
    ============================== */

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        padding: 30px 15px;

        background: linear-gradient(
            135deg,
            #000000,
            #222222,
            #434343
        );
    }


    /* ==============================
       MAIN CONTAINER
    ============================== */

    .container {
        width: 500px;
        max-width: 100%;

        padding: 40px;

        background: rgba(255, 255, 255, 0.97);

        border-radius: 20px;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, 0.5);

        text-align: center;
    }


    /* ==============================
       TITLE
    ============================== */

    .title {
        color: #222;

        margin-bottom: 30px;

        font-size: 32px;
        font-weight: 700;

        line-height: 1.3;
    }


    /* ==============================
       BUTTON / LINK
    ============================== */

    .btn {
        display: block;

        width: 100%;

        padding: 14px 20px;

        margin: 12px 0;

        border-radius: 10px;

        text-decoration: none;

        border: none;

        cursor: pointer;

        font-size: 16px;
        font-weight: bold;

        color: white;

        text-align: center;

        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease,
            opacity 0.25s ease;
    }


    /* ==============================
       QUESTION BUTTON
    ============================== */

    .question-btn {
        background: #007bff;
    }


    /* ==============================
       LOGIN BUTTON
    ============================== */

    .login-btn {
        background: #6f42c1;
    }


    /* ==============================
       STUDENT BUTTON
    ============================== */

    .student-btn {
        background: #28a745;
    }


    /* ==============================
       RESULT BUTTON
    ============================== */

    .result-btn {
        background: #fd7e14;
    }


    /* ==============================
       SCORE BUTTON
    ============================== */

    .score-btn {
        background: #dc3545;
    }


    /* ==============================
       TEST BUTTON
    ============================== */

    .test-btn {
        background: #20c997;
    }


    /* ==============================
       HOVER EFFECT
    ============================== */

    .btn:hover {
        transform: translateY(-3px);

        opacity: 0.95;

        box-shadow:
            0 8px 18px rgba(0, 0, 0, 0.25);
    }


    /* ==============================
       CLICK EFFECT
    ============================== */

    .btn:active {
        transform: translateY(0);

        box-shadow:
            0 3px 8px rgba(0, 0, 0, 0.2);
    }


    /* ==============================
       RESPONSIVE DESIGN
    ============================== */

    @media (max-width: 600px) {

        body {
            padding: 20px 12px;
        }

        .container {
            width: 100%;

            padding: 30px 20px;

            border-radius: 15px;
        }

        .title {
            font-size: 25px;

            margin-bottom: 25px;
        }

        .btn {
            padding: 13px 15px;

            font-size: 15px;
        }
    }


    /* ==============================
       SMALL MOBILE
    ============================== */

    @media (max-width: 400px) {

        .container {
            padding: 25px 15px;
        }

        .title {
            font-size: 22px;
        }

        .btn {
            font-size: 14px;

            padding: 12px;
        }
    }

</style>

</head>
<body>

<div class="container">

    <h1 class="title">📚 Online Examination System</h1>

    <a href="{% url 'question_curd' %}" class="btn question-btn">
        📝 Question Operations
    </a>

    <a href="{% url 'login_page' %}" class="btn login-btn">
        🔐 Student Login
    </a>

    <a href="{% url 'student_curd' %}" class="btn student-btn">
        👨‍🎓 Student Operations
    </a>

    <a href="{% url 'get_all_result_page' %}" class="btn result-btn">
        📊 View All Results
    </a>

    <a href="{% url 'score_page' %}" class="btn score-btn">
        🎯 My Result
    </a>

    <a href="{% url 'start_test_page' %}" class="btn test-btn">
    🚀 Start Test
</a>

</div>
</body>
</html>
